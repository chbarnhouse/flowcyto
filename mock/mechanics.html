<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowCyto mechanics</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  body { padding: 22px; }
  .opt { max-width: 1180px; margin: 0 auto 26px; padding: 18px 22px 22px; }
  .opt > h2 { font-size: var(--fs-xl); display: flex; gap: 10px; align-items: center; }
  .opt > p.how { margin: 4px 0 14px; color: var(--ink-2); font-size: var(--fs-sm); max-width: 820px; }
  .tag { font-size: var(--fs-xs); font-weight: 800; border: 1.5px solid var(--ink); border-radius: 6px; padding: 1px 7px; }
  .row { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .plots { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 520px; }
  .plots figure { margin: 0; }
  .plots figcaption { font-size: var(--fs-xs); color: var(--muted); text-align: center; font-weight: 600; }
  .side { flex: 0 1 380px; min-width: 300px; }
  .ask { font-weight: 700; margin-bottom: 8px; }
  .dx { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1.5px solid var(--line); border-radius: 9px; margin-bottom: 6px; font-size: var(--fs-sm); font-weight: 600; }
  .dx.out { color: var(--muted); text-decoration: line-through; background: var(--sunk); }
  .dx .why { margin-left: auto; font-size: var(--fs-xs); font-weight: 600; text-decoration: none; color: var(--muted); }
  .dx.pick { border: 3px solid var(--blue); background: var(--blue-bg); }
  .rack { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .tube { padding: 5px 10px; border: 1.5px solid var(--line); border-radius: 999px; font-size: var(--fs-xs); font-weight: 700; background: var(--card); }
  .tube.used { background: var(--sunk); color: var(--muted); border-style: dashed; }
  .meter { display: flex; gap: 6px; align-items: center; font-size: var(--fs-sm); font-weight: 700; margin-bottom: 8px; }
  .slot { width: 22px; height: 10px; border-radius: 3px; border: 1.5px solid var(--ink-2); }
  .slot.full { background: var(--ink-2); }
  table.grid { border-collapse: collapse; font-size: var(--fs-sm); }
  .grid th { font-weight: 700; padding: 4px 6px; }
  .grid thead th { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; height: 128px; font-size: var(--fs-xs); white-space: nowrap; }
  .grid tbody th { text-align: left; white-space: nowrap; }
  .grid td { width: 30px; height: 30px; border: 1px solid var(--line); text-align: center; }
  .grid td.no { background: var(--sunk); }
  .grid td.yes { background: var(--blue-bg); }
  .note { margin-top: 10px; font-size: var(--fs-xs); color: var(--muted); }
  .pct { margin-top: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: var(--fs-sm); font-weight: 600; }
  .pct .btn { min-height: 30px; padding: 3px 10px; }
</style>
</head>
<body>
<div id="out"></div>
<script src="../js/kb.js"></script>
<script src="../js/gen.js"></script>
<script src="../js/plot.js"></script>
<script>
const { generate, renderPlot, shapeIcon, BY, fits, plotMarkers } = FC;
const SEED = +(location.hash.slice(1) || 68);
const P = generate(SEED, 'medium');
const clone = P.pops.find(p => BY[p.id].kind === 'neoplasm');
const X = '<svg class="ic" viewBox="0 0 16 16" aria-label="ruled out"><path d="M4 4l8 8M12 4l-8 8" stroke="var(--ink-2)" stroke-width="2.2" stroke-linecap="round"/></svg>';
const DOT = '<svg class="ic" viewBox="0 0 16 16" aria-label="this one"><circle cx="8" cy="8" r="5" fill="var(--blue)" stroke="var(--ink)" stroke-width="1"/></svg>';
const fig = (pl, o = {}) => `<figure>${renderPlot(P, pl, { size: 210, ...o })}<figcaption>${pl.x === 'LC' ? 'kappa / lambda' : pl.x + ' / ' + pl.y}</figcaption></figure>`;
const popName = p => `${shapeIcon(p.slot)} <b>${p.label}</b>`;

// ---- A: diagnose the clone ----
const sibs = Object.values(BY).filter(e => e.kind === 'neoplasm' && e.lineage === BY[clone.id].lineage && e.id !== clone.id).slice(0, 4).map(e => e.id);
const dxList = [clone.id, ...sibs].sort();
const shownMk = ['SSC', ...P.plots.slice(1).flatMap(q => plotMarkers([q.x, q.y]))];
const A = `<section class="card opt"><h2><span class="tag">A</span> Diagnose the clone</h2>
<p class="how">One abnormal population is outlined; the rest of the sample is faded background. Read the plots, strike out the diagnoses they rule out, and commit to the one left. Short and close to a STEP vignette, but each board is one lookup, not a web of deductions.</p>
<div class="row"><div class="plots">${P.plots.map(pl => fig(pl, { focus: clone.slot })).join('')}</div>
<div class="side"><div class="ask">${P.specName}. Which neoplasm is ${popName(clone)}?</div>
${dxList.map((id, i) => { const out = !fits(id, clone, shownMk); const pick = id === clone.id;
  return `<div class="dx ${out ? 'out' : ''} ${pick ? 'pick' : ''}">${out ? X : pick ? DOT : '<span class="ic"></span>'} ${BY[id].name}${out ? '<span class="why">ruled out</span>' : ''}</div>`; }).join('')}
<button class="btn primary">Diagnose</button></div></div></section>`;

// ---- B: order the tubes ----
const usedKeys = [P.plots[1] && P.plots[1].key].filter(Boolean);
const rack = ['CD19/CD5', 'CD5/CD23', 'CD23/CD200', 'CD20/FMC7', 'CD19/CD10', 'CD11c/CD103', 'CD25/CD103', 'LC', 'CD4/CD8', 'CD7/CD3', 'CD34/CD117', 'TdT/CD10', 'CD38/CD138', 'CD55/CD59'];
const B = `<section class="card opt"><h2><span class="tag">B</span> Order the tubes</h2>
<p class="how">You start with scatter only. Each tube you order reveals one plot; the diagnosis is hidden until you name it. Par is the fewest tubes that can settle it (the generator computes it). Rewards knowing which marker splits CLL from mantle cell, less about reading plots.</p>
<div class="row"><div class="plots">${fig(P.plots[0])}${P.plots[1] ? fig(P.plots[1]) : ''}
<figure style="width:210px;height:236px;display:grid;place-items:center;border:2px dashed var(--line);border-radius:12px;color:var(--muted);font-weight:700;font-size:13px">next tube</figure></div>
<div class="side"><div class="meter">Tubes ${'<span class="slot full"></span>'.repeat(1)}${'<span class="slot"></span>'.repeat(3)} 1 of 4 · par 2</div>
<div class="ask">Order a tube</div><div class="rack">${rack.map(k => `<span class="tube ${usedKeys.includes(k) ? 'used' : ''}">${k === 'LC' ? 'kappa / lambda' : k}</span>`).join('')}</div>
<div class="ask">Then: what is the abnormal population?</div><button class="btn">Name the diagnosis…</button></div></div></section>`;

// ---- C: name every population ----
const cand = FC.countSolutions(P.pops, P.pool, FC.markersOf(P.plots.map(q => [q.x, q.y]))).cand;
const marks = {}; // a half-solved state: the player's crosses so far
P.pops.forEach((p, i) => P.pool.forEach(id => { if (!cand[i].includes(id) && (i + id.length) % 3) marks[p.label + id] = 'no'; }));
const solved = P.pops.find((p, i) => cand[i].length === 1); if (solved) marks[solved.label + solved.id] = 'yes';
const C = `<section class="card opt"><h2><span class="tag">C</span> Name every population <span class="pill">recommended</span></h2>
<p class="how">Every population in the tube gets a shape and a letter. Give each one an identity from the list; decoys are mixed in and no identity is used twice. Cross off cells in the grid like a logic puzzle. Harder boards show fewer plots, so some letters fit two identities until another letter claims one. That is where the sudoku feel comes from. Hard adds a red-herring plot and a "what percent is the clone" question.</p>
<div class="row"><div class="plots">${P.plots.map(pl => fig(pl)).join('')}</div>
<div class="side"><div class="ask">${P.specName}. Name each population.</div>
<table class="grid"><thead><tr><th></th>${P.pool.map(id => `<th>${BY[id].name}</th>`).join('')}</tr></thead><tbody>
${P.pops.map(p => `<tr><th>${popName(p)}</th>${P.pool.map(id => { const m = marks[p.label + id]; return `<td class="${m || ''}">${m === 'no' ? X : m === 'yes' ? DOT : ''}</td>`; }).join('')}</tr>`).join('')}
</tbody></table>
<div class="note">Tap a cell: blank, then ruled out (X), then this one (dot). Check marks each row right or wrong, with the reason.</div>
<div class="pct">Hard only: ${popName(clone)} is what share of all events? ${[12, 24, 37, 51].map(v => `<span class="btn">${v}%</span>`).join('')}</div>
</div></div></section>`;

document.getElementById('out').innerHTML = A + B + C;
</script>
</body>
</html>
